<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    
<title>Lista de Tarefas</title>

<style>
    body {
        font-family : Arial, sans-serif;
        background-color:#eeeeee;
        margin: 0;
        padding: 0;
    }

    .container {
        width:500px;
        margin: 50px auto;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0  10px#999;
    }

    h1 {
        text-align: center;
        color: #333;
    }

    .entrada {
        display:flex;
        gap: 10px;
    }

    input {
        flex: 1;
        padding: 12px;
        border: 1px solid#999;
        border-radius: 5px;
    }

    button{
        padding: 12px;
        border:none;
        border-radius: 5px;
        cursor:pointer;
        background-color:#2563eb;
        color: white;
    }

    button:hover {
        background-color: #174ea6;
    }
    
    ul {
        display: flex;
        justify-content:space-between;
        align-items:center;
        padding: 12px;
        margin-top: 10px;
        background-color: #f3f3f3;
        border-radius: 5px;
    }

    .concluida {
        text-decoration: line-through;
        color: gray;
    }

</style>
